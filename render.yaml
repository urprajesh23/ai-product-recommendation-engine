services:
  - type: web
    name: product-recommender-api
    env: docker
    plan: free
    dockerCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REDIS_HOST
        value: "" # Empty for free tier since Redis might need a separate paid instance, or we can disable caching
      - key: LOG_LEVEL
        value: INFO
