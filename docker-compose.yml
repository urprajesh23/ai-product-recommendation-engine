# ==================== Networks ====================
networks:
  recommender-network:
    driver: bridge
    name: recommender-network

# ==================== Volumes ====================
volumes:
  redis-data:
    driver: local
    name: recommender-redis-data
  
  mlflow-data:
    driver: local
    name: recommender-mlflow-data
  
