version: '3.8'

# ==================== Services ====================
services:
  
  # ==================== API Service ====================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recommender-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_CACHE_TTL=3600
      
      # MLflow Configuration
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=product-recommender
      
      # Model Paths
      - MODEL_PATH=/app/models/hybrid_model.pkl
      - MODEL_V1_PATH=/app/models/collaborative_model.pkl
      - MODEL_V2_PATH=/app/models/hybrid_model.pkl
      - TRAIN_MATRIX_PATH=/app/data/processed/train_matrix.pkl
      - MAPPINGS_PATH=/app/data/processed/mappings.pkl
      
      # Other
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    
    volumes:
      # Mount local directories to container
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
      - ./mlruns:/app/mlruns
      - ./frontend:/app/frontend
    
    depends_on:
      - redis
      - mlflow
    
    networks:
      - recommender-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    labels:
      - "com.recommender.service=api"
      - "com.recommender.version=1.0.0"

  # ==================== Redis Service ====================
  redis:
    image: redis:7-alpine
    container_name: recommender-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    
    volumes:
      - redis-data:/data
    
    networks:
      - recommender-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    labels:
      - "com.recommender.service=cache"

  # ==================== MLflow Service ====================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.1
    container_name: recommender-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    
    volumes:
      - mlflow-data:/mlflow
      - ./mlruns:/mlflow/mlruns
    
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    
    networks:
      - recommender-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "com.recommender.service=mlflow"

